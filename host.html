<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Test restaurant: table reservations</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #1c1a17; color: #eee; }
    header, footer { padding: 32px 16px; text-align: center; }
    main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    #log { max-width: 760px; margin: 24px auto 0; padding: 0 16px; font: 13px/1.5 monospace; color: #9c9; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Ravintola Testi</h1>
    <p>Pöytävaraukset</p>
  </header>

  <main>
    <!-- SciPOS reservation embed (dev environment, store "sciometa office") -->
    <script async src="https://dev-pos.sciometa.com/widget/reserve.js"
            data-store="09df4ce" data-lang="auto"></script>
  </main>

  <!-- Shows the booking event the embed sends to the host page -->
  <div id="log"></div>
  <script>
    window.addEventListener('sciometa:reservation', function (e) {
      document.getElementById('log').textContent =
        'sciometa:reservation event received:\n' + JSON.stringify(e.detail, null, 2);
    });
  </script>

  <footer>Host page footer</footer>
</body>
</html>
